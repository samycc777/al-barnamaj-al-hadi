// A Trusted Web Activity: the app opens https://al-barnamaj-al-hadi.pages.dev full screen in the
// phone's browser engine, so it always shows the live site. Built and signed on GitHub Actions
// (.github/workflows/android.yml); the key is in Actions secrets, never in git.
plugins { id 'com.android.application' }

android {
    namespace 'dev.pages.albarnamajalhadi'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.pages.albarnamajalhadi'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.${System.getenv('VERSION_CODE') ?: '1'}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'hadi'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
