# Builds the Android app (android/, a Trusted Web Activity of the site), signs it and publishes it
# as a GitHub release; /app.apk on the site redirects to the latest one. Google's build tools are
# x86-only, so this runs here rather than on the ARM laptop.
name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks" gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk al-barnamaj-al-hadi.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" al-barnamaj-al-hadi.apk \
            --title "تطبيق البرنامج الهادي 1.${{ github.run_number }}" --notes "Android app (APK)." --latest
